<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyWise - Login/Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="basic.css">
</head>
<body>
    <!--NAVBAR-->
    <div id="nav" class="navbar-light border-light">
        <img src="buywise.jpg" alt="buywise" width="50" height="50" style="padding: 3px;">
        <p class="col-md-2 offset-md-1" style="font-variant: small-caps;font-size: large;font-family: sans-serif; color: goldenrod;">BuyWise</p>
        <a class="col-md-1 offset-md-3 text-white" href="basic.html">Home</a>
        <a class="col-md-1 text-white" href="aboutus.html">About Us</a>
        <a class="col-md-1 text-white" href="contact.html">Contact</a>
        <button class="col-md-2 rounded border-light" onclick="showlogin()" style="font-family: sans-serif; background-color: rgb(198, 198, 198); font-variant: small-caps; margin:5px;">Login</button>
    </div>

    <!--LOGIN/SIGNUP CONTAINER-->
    <div id="login_container">
        <center>
            <!-- LOGIN FORM -->
            <form id="loginForm" style="display:block;">
                <h1>LOGIN</h1><br>
                <label class="form-label required">Email</label>
                <input id="loginEmail" class="border-bottom border-dark" type="email" required><br>
                <label class="form-label required">Password</label>
                <input id="loginPassword" class="border-bottom border-dark" type="password" required><br>
                <label class="form-label required">Role</label>
                <select id="loginRole" class="form-select">
                    <option value="CUSTOMER">Customer</option>
                    <option value="RETAILER">Retailer</option>
                    <option value="EMPLOYEE">Employee</option>
                </select><br>
                <div class="h3-container">
                    <h3 id="demo1"><button type="button" onclick="showsignup()">New User? Signup</button></h3>
                    <h3 id="demo2"><a href="#">Forgot Password</a></h3>
                </div>
                <button style="color: rgb(255, 255, 255); background-color: rgb(20, 17, 99);" type="button" onclick="handleLogin()">Login</button>
            </form>

            <!-- SIGNUP FORM -->
            <form id="signupForm" style="display:none;">
                <h1>SIGNUP</h1><br>
                <label class="form-label required">Name</label>
                <input id="signupName" class="border-bottom border-dark" type="text" required><br>
                <label class="form-label required">Email</label>
                <input id="signupEmail" class="border-bottom border-dark" type="email" required><br>
                <label class="form-label required">Password</label>
                <input id="signupPassword" class="border-bottom border-dark" type="password" required><br>
                <label class="form-label required">Mobile</label>
                <input id="signupMobile" class="border-bottom border-dark" type="tel" required><br>
                <label class="form-label required">Role</label>
                <select id="signupRole" class="form-select">
                    <option value="CUSTOMER">Customer</option>
                    <option value="RETAILER">Retailer</option>
                    <option value="EMPLOYEE">Employee</option>
                </select><br>
                <h3><button type="button" onclick="showlogin()">Already have an account? Login</button></h3>
                <button style="color: rgb(255, 255, 255); background-color: rgb(20, 17, 99);" type="button" onclick="handleSignup()">Signup</button>
            </form>
        </center>
    </div>

    <!--IMAGES-->
    <div class="container-fluid g-0">
        <div class="row g-0">
            <div class="col-md-6">
                <img src="dress.jpg" alt="Big Square" class="big-img">
            </div>
            <div class="col-md-6 right-col">
                <img src="grocery.jpg" alt="Small Square 1" class="small-img">
                <img src="access.jpg" alt="Small Square 2" class="small-img">
            </div>
        </div>
    </div>

    <script src="basic.js"></script>
</body>
</html>
